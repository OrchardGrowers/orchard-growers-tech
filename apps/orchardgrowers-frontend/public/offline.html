<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15803d" />
    <title>Orchard Growers Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef6f0;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(420px, 100%);
        border: 1px solid #bbf7d0;
        border-radius: 16px;
        background: #ffffff;
        padding: 24px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      }

      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
        color: #14532d;
      }

      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: #475569;
      }

      button {
        min-height: 44px;
        margin-top: 20px;
        border: 0;
        border-radius: 999px;
        background: #15803d;
        color: #ffffff;
        padding: 0 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Orchard Growers" />
      <h1>You are offline</h1>
      <p>Orchard Growers could not reach the network. Reconnect and refresh to continue shopping or managing your account.</p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
